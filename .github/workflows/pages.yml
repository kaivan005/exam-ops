name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate public API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "Deploy the API first, then set VITE_API_URL to its public HTTPS origin."; exit 1; }
          case "$VITE_API_URL" in https://*) ;; *) echo "VITE_API_URL must use HTTPS."; exit 1 ;; esac
          case "$VITE_API_URL" in *github.io*) echo "Warning: VITE_API_URL points to a GitHub Pages host. Ensure the API is reachable from this origin."; ;; esac
      - run: npm run build --workspace apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /exam-ops/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
