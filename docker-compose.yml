services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: examops
      POSTGRES_PASSWORD: examops
      POSTGRES_DB: examops
    volumes: [examops-db:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examops -d examops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://examops:examops@db:5432/examops?schema=public
      SESSION_SECRET: local-development-secret-change-me
      WEB_ORIGIN: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    ports: ["5173:4000"]
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/src/server.js"
volumes:
  examops-db:
